name: Prepare assets

on:
  push:
    branches: [main]
    paths:
      - "assets pt 1.zip"
      - "assets pt 2.zip"
      - ".github/workflows/prepare-assets.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and merge assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          extract_zip () {
            zip="$1"
            tmp="$(mktemp -d)"
            echo "Extracting $zip"
            unzip -oq "$zip" -d "$tmp"

            if [ -d "$tmp/assets" ]; then
              cp -a "$tmp/assets/." assets/
            else
              cp -a "$tmp/." assets/
            fi

            rm -rf "$tmp"
          }

          extract_zip "assets pt 1.zip"
          extract_zip "assets pt 2.zip"

          # If the zips contained an extra wrapper directory, repair the layout
          # by locating the known Zoe splash expected by app.js.
          if [ ! -f "assets/champions/Zoe.webp" ]; then
            zoe="$(find assets -type f -path '*/champions/Zoe.webp' -print -quit || true)"
            if [ -n "$zoe" ]; then
              root="${zoe%/champions/Zoe.webp}"
              tmpfix="$(mktemp -d)"
              cp -a "$root/." "$tmpfix/"
              rm -rf assets
              mkdir assets
              cp -a "$tmpfix/." assets/
              rm -rf "$tmpfix"
            fi
          fi

          test -f "assets/champions/Zoe.webp"

          echo "Asset files:"
          find assets -type f | wc -l

          rm -f "assets pt 1.zip" "assets pt 2.zip"

      - name: Commit prepared assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Extract assets into assets/ [skip ci]"
          git push
